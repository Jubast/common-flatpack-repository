app-id: dev.herdr.app
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: herdr-launcher
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=HERDR_APP_ID=dev.herdr.app
  - --env=SHELL=/usr/bin/bash
  - --env=HISTFILE=/var/data/bash_history
  - --persist=.local
  # Claude Code settings, login and skills; the claude wrapper points CLAUDE_CONFIG_DIR here.
  - --persist=.claude
  # /app is read-only; Claude updates with this package.
  - --env=DISABLE_AUTOUPDATER=1
modules:
  - name: herdr-core
    buildsystem: simple
    build-commands:
      - install -Dm755 herdr-core /app/bin/herdr-core
      - ln -s herdr-core /app/bin/hc
      - install -Dm644 -t /app/share/licenses/dev.herdr.app/herdr-core LICENSE THIRD-PARTY-NOTICES
    sources:
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        url: https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz
        sha256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1

  - ../shared/git.yml

  - ../shared/claude.yml

  - name: herdr-app
    buildsystem: simple
    build-commands:
      # herdr-app.svg stays out of /app/bin: next to the binary it enables upstream's self-updater.
      - install -Dm755 herdr-app /app/bin/herdr-app
      - install -Dm755 herdr-launcher /app/bin/herdr-launcher
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm644 -t /app/share/herdr/skills/herdr-app skills/herdr-app/SKILL.md
      - install -Dm644 -t /app/share/herdr/skills/herdr-core skills/herdr-core/SKILL.md
      - install -Dm644 -t /app/share/licenses/dev.herdr.app/herdr-app LICENSE THIRD-PARTY-NOTICES
      - install -Dm644 herdr-app.svg /app/share/icons/hicolor/scalable/apps/dev.herdr.app.svg
      - install -Dm644 dev.herdr.app.desktop /app/share/applications/dev.herdr.app.desktop
      - install -Dm644 dev.herdr.app.metainfo.xml /app/share/metainfo/dev.herdr.app.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://releases.herdr.dev/app/0.1.16/herdr-app-linux-x86_64.tar.gz
        sha256: 282d2632196b238206cfe66bfb61c0faf299ca1c91843bd076521bbe36571216
      - type: file
        path: herdr-launcher
      - type: file
        path: apply_extra.sh
      - type: dir
        path: skills
        dest: skills
      - type: file
        path: dev.herdr.app.desktop
      - type: file
        path: dev.herdr.app.metainfo.xml
