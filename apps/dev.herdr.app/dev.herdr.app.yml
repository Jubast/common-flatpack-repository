app-id: dev.herdr.app
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: herdr-app
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=HERDR_APP_ID=dev.herdr.app
modules:
  - name: herdr-core
    buildsystem: simple
    build-commands:
      - install -Dm755 herdr-core /app/bin/herdr-core
      - ln -s herdr-core /app/bin/hc
      - install -Dm644 -t /app/share/licenses/dev.herdr.app/herdr-core LICENSE THIRD-PARTY-NOTICES
    sources:
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        url: https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
        sha256: ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74

  - name: herdr-app
    buildsystem: simple
    build-commands:
      # herdr-app.svg stays out of /app/bin: next to the binary it enables upstream's self-updater.
      - install -Dm755 herdr-app /app/bin/herdr-app
      - install -Dm644 -t /app/share/licenses/dev.herdr.app/herdr-app LICENSE THIRD-PARTY-NOTICES
      - install -Dm644 herdr-app.svg /app/share/icons/hicolor/scalable/apps/dev.herdr.app.svg
      - install -Dm644 dev.herdr.app.desktop /app/share/applications/dev.herdr.app.desktop
      - install -Dm644 dev.herdr.app.metainfo.xml /app/share/metainfo/dev.herdr.app.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://releases.herdr.dev/app/0.1.14/herdr-app-linux-x86_64.tar.gz
        sha256: 475a383f8f439e3191a86635b5c1286ce4dfd2d9fcdf1e7cbdfdd6c7176f8ff3
      - type: file
        path: dev.herdr.app.desktop
      - type: file
        path: dev.herdr.app.metainfo.xml
